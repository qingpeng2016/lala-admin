<form class="layui-form layui-card" action="{:request()->url()}" data-auto="true" method="post" autocomplete="off">
    <div class="layui-card-body">

        <div class="layui-form-item">
            <label class="layui-form-label">支付类型</label>
            <div class="layui-input-block">
                <select name="payment_type" class="layui-select" required>
                    <option value="Alipay" {if !isset($vo.payment_type) || $vo.payment_type eq 'Alipay'}selected{/if}>Alipay</option>
                    <option value="WechatPay" {if isset($vo.payment_type) and $vo.payment_type eq 'WechatPay'}selected{/if}>WechatPay</option>
                    <option value="Bitcoin" {if isset($vo.payment_type) and $vo.payment_type eq 'Bitcoin'}selected{/if}>Bitcoin</option>
                </select>
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">订单金额</label>
            <div class="layui-input-block">
                <input name="amount" value='{$vo.amount|default=""}' required placeholder="请输入收款金额" class="layui-input" type="number" step="0.01" min="0">
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">备注</label>
            <div class="layui-input-block">
                <textarea name="remark" placeholder="请输入备注信息" class="layui-textarea">{$vo.remark|default=""}</textarea>
            </div>
        </div>
        <div class="hr-line-dashed"></div>
        {notempty name='vo.id'}<input type='hidden' value='{$vo.id}' name='id'>{/notempty}
        <div class="layui-form-item text-center">
            <button class="layui-btn" type='submit'>保存数据</button>
            <button class="layui-btn layui-btn-danger" type='button' data-confirm="确定要取消编辑吗？" data-close>取消编辑</button>
        </div>
    </div>
</form>

<script>
layui.use(['form'], function(){
    var form = layui.form;
    
    // 表单提交监听
    form.on('submit(*)', function(data) {
        console.log('Form data:', data.field);
        return true;
    });
});
</script>
