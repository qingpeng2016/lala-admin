{extend name="../../admin/view/main"}

{block name="content"}
<div class="layui-fluid">
    <div class="layui-card">
        <div class="layui-card-header">
            <h3>{$vo ? '编辑问题' : '添加问题'}</h3>
        </div>
        <div class="layui-card-body">
            <form class="layui-form" id="questionForm">
                <div class="layui-row layui-col-space15">
                    <div class="layui-col-md6">
                        <div class="layui-form-item">
                            <label class="layui-form-label">问题类型 <span style="color: red;">*</span></label>
                            <div class="layui-input-block">
                                <select name="type" lay-verify="required" lay-filter="type">
                                    <option value="">请选择问题类型</option>
                                    {foreach $type_list as $key => $val}
                                    <option value="{$key}" {if isset($vo.type) && $vo.type eq $key}selected{/if}>{$val}</option>
                                    {/foreach}
                                </select>
                            </div>
                        </div>
                    </div>
                    <div class="layui-col-md6">
                        <div class="layui-form-item">
                            <label class="layui-form-label">问题分类</label>
                            <div class="layui-input-block">
                                <select name="category" lay-filter="category">
                                    <option value="">请选择问题分类</option>
                                    {foreach $category_list as $key => $val}
                                    <option value="{$key}" {if isset($vo.category) && $vo.category eq $key}selected{/if}>{$val}</option>
                                    {/foreach}
                                </select>
                            </div>
                        </div>
                    </div>
                </div>
                
                <div class="layui-form-item">
                    <label class="layui-form-label">问题标题 <span style="color: red;">*</span></label>
                    <div class="layui-input-block">
                        <input type="text" name="title" value="{$vo.title|default=''}" placeholder="请输入问题标题" lay-verify="required" class="layui-input">
                    </div>
                </div>
                
                <div class="layui-form-item">
                    <label class="layui-form-label">问题描述 <span style="color: red;">*</span></label>
                    <div class="layui-input-block">
                        <textarea name="problem_description" id="problem_description" lay-verify="required" placeholder="请输入问题描述" class="layui-textarea" style="height: 50px;">{$vo.problem_description|default=''}</textarea>
                    </div>
                </div>
                
                <div class="layui-form-item">
                    <label class="layui-form-label">解决方案 <span style="color: red;">*</span></label>
                    <div class="layui-input-block">
                        <textarea name="solution_description" id="solution_description" lay-verify="required" placeholder="请输入解决方案" class="layui-textarea">{$vo.solution_description|default=''}</textarea>
                    </div>
                </div>
                
                <div class="layui-form-item">
                    <div class="layui-input-block">
                        <button class="layui-btn" lay-submit lay-filter="submitForm">
                            <i class="layui-icon layui-icon-ok"></i> 保存
                        </button>
                        <button type="button" class="layui-btn layui-btn-primary" onclick="parent.layer.closeAll()">
                            <i class="layui-icon layui-icon-close"></i> 取消
                        </button>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>
{/block}

{block name="script"}
<script src="/static/plugs/ckeditor5/ckeditor.js"></script>
<script>
layui.use(['layer', 'form'], function(){
    var layer = layui.layer;
    var form = layui.form;
    
    // 初始化富文本编辑器
    let problemEditor, solutionEditor;
    
    // 问题描述编辑器（小高度）
    ClassicEditor
        .create(document.querySelector('#problem_description'), {
            toolbar: {
                items: [
                    'heading', '|',
                    'bold', 'italic', 'underline', '|',
                    'bulletedList', 'numberedList', '|',
                    'link', '|',
                    'undo', 'redo'
                ]
            },
            language: 'zh-cn',
            height: 50
        })
        .then(editor => {
            problemEditor = editor;
        })
        .catch(error => {
            console.error('问题描述编辑器初始化失败:', error);
        });
    
    // 解决方案编辑器（完整功能）
    ClassicEditor
        .create(document.querySelector('#solution_description'), {
            toolbar: {
                items: [
                    'heading', '|',
                    'bold', 'italic', 'underline', 'strikethrough', '|',
                    'fontSize', 'fontFamily', 'fontColor', 'fontBackgroundColor', '|',
                    'bulletedList', 'numberedList', 'todoList', '|',
                    'outdent', 'indent', '|',
                    'alignment', '|',
                    'link', 'blockQuote', 'insertTable', '|',
                    'codeBlock', '|',
                    'undo', 'redo'
                ]
            },
            language: 'zh-cn',
            table: {
                contentToolbar: [
                    'tableColumn',
                    'tableRow',
                    'mergeTableCells'
                ]
            }
        })
        .then(editor => {
            solutionEditor = editor;
        })
        .catch(error => {
            console.error('解决方案编辑器初始化失败:', error);
        });
    
    // 表单提交
    form.on('submit(submitForm)', function(data) {
        // 获取富文本编辑器内容
        var formData = data.field;
        formData.problem_description = problemEditor.getData();
        formData.solution_description = solutionEditor.getData();
        
        // 验证富文本内容
        if (!formData.problem_description.trim()) {
            layer.msg('问题描述不能为空', {icon: 2});
            return false;
        }
        if (!formData.solution_description.trim()) {
            layer.msg('解决方案不能为空', {icon: 2});
            return false;
        }
        
        // 显示加载层
        var loadIndex = layer.load(1, {shade: [0.1, '#fff']});
        
        // 提交数据
        $.post('', formData, function(res) {
            layer.close(loadIndex);
            if (res.code === 1) {
                layer.msg('保存成功', {icon: 1});
                setTimeout(function() {
                    parent.layer.closeAll();
                    parent.location.reload();
                }, 1000);
            } else {
                layer.msg(res.info || '保存失败', {icon: 2});
            }
        }, 'json').fail(function() {
            layer.close(loadIndex);
            layer.msg('网络错误，请重试', {icon: 2});
        });
        
        return false;
    });
    
    // 类型变化时更新分类选项
    form.on('select(type)', function(data) {
        var type = data.value;
        var categorySelect = $('select[name="category"]');
        
        // 根据类型动态设置分类选项
        var categoryOptions = {
            'ticket': [
                {value: 'network', text: '网络问题'},
                {value: 'account', text: '账户问题'},
                {value: 'billing', text: '账单问题'},
                {value: 'service', text: '服务问题'},
                {value: 'other', text: '其他问题'}
            ],
            'startup': [
                {value: 'hardware', text: '硬件问题'},
                {value: 'software', text: '软件问题'},
                {value: 'network', text: '网络问题'},
                {value: 'other', text: '其他问题'}
            ],
            'vip_issue': [
                {value: 'service', text: '服务问题'},
                {value: 'billing', text: '账单问题'},
                {value: 'account', text: '账户问题'},
                {value: 'other', text: '其他问题'}
            ]
        };
        
        // 清空并重新填充分类选项
        categorySelect.empty();
        categorySelect.append('<option value="">请选择问题分类</option>');
        
        if (categoryOptions[type]) {
            categoryOptions[type].forEach(function(option) {
                categorySelect.append('<option value="' + option.value + '">' + option.text + '</option>');
            });
        } else {
            // 默认选项
            Object.keys(categoryOptions).forEach(function(key) {
                categoryOptions[key].forEach(function(option) {
                    categorySelect.append('<option value="' + option.value + '">' + option.text + '</option>');
                });
            });
        }
        
        form.render('select');
    });
});
</script>

<style>
.layui-form-label {
    width: 100px;
}

.layui-input-block {
    margin-left: 110px;
}

.ck-editor__editable {
    min-height: 50px;
}

#solution_description + .ck-editor .ck-editor__editable {
    min-height: 200px;
}

.layui-card-header h3 {
    margin: 0;
    color: #333;
}
</style>
{/block}
