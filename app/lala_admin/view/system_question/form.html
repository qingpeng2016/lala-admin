<form class="layui-form layui-card" action="{:request()->url()}" data-auto="true" method="post" autocomplete="off">
    <div class="layui-card-body">

        <div class="layui-form-item">
            <label class="layui-form-label">问题类型 <span style="color: red;">*</span></label>
            <div class="layui-input-block">
                <select name="type" class="layui-select" required>
                    <option value="">请选择问题类型</option>
                    {foreach $type_list as $key=>$item}
                    <option value="{$key}" {if isset($vo.type) && $vo.type eq $key}selected{/if}>{$item}</option>
                    {/foreach}
                </select>
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">问题分类</label>
            <div class="layui-input-block">
                <select name="category" class="layui-select">
                    <option value="">请选择问题分类</option>
                    {foreach $category_list as $key=>$item}
                    <option value="{$key}" {if isset($vo.category) && $vo.category eq $key}selected{/if}>{$item}</option>
                    {/foreach}
                </select>
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">问题标题 <span style="color: red;">*</span></label>
            <div class="layui-input-block">
                <input name="title" value='{$vo.title|default=""}' required placeholder="请输入问题标题" class="layui-input" maxlength="255">
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">问题描述 <span style="color: red;">*</span></label>
            <div class="layui-input-block">
                <textarea name="problem_description" placeholder="请输入问题描述" class="layui-textarea" rows="5" required>{$vo.problem_description|default=""}</textarea>
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">解决方案 <span style="color: red;">*</span></label>
            <div class="layui-input-block">
                <textarea name="solution_description" id="solution_description" placeholder="请输入解决方案" class="layui-textarea ckeditor" rows="8" required>{$vo.solution_description|default=""}</textarea>
            </div>
        </div>
        <div class="hr-line-dashed"></div>
        {notempty name='vo.id'}<input type='hidden' value='{$vo.id}' name='id'>{/notempty}
        <div class="layui-form-item text-center">
            <button class="layui-btn" type='submit'>保存数据</button>
            <button class="layui-btn layui-btn-danger" type='button' data-confirm="确定要取消编辑吗？" data-close>取消编辑</button>
        </div>
    </div>
</form>

<script>
layui.use(['form'], function(){
    var form = layui.form;
    var solutionEditor;
    
    // 使用RequireJS加载CKEditor
    require(['ckeditor'], function() {
        // 初始化富文本编辑器
        $(document).ready(function() {
            // 创建解决方案富文本编辑器
            if (typeof window.createEditor !== 'undefined') {
                solutionEditor = window.createEditor('#solution_description', {
                    height: 300,
                    toolbar: [
                        {name: 'document', items: ['Source']},
                        {name: 'styles', items: ['Font', 'FontSize']},
                        {name: 'basicstyles', items: ['Bold', 'Italic', 'Underline', 'Strike', 'RemoveFormat', 'TextColor', 'BGColor', 'JustifyLeft', 'JustifyCenter', 'JustifyRight', 'JustifyBlock', 'NumberedList', 'BulletedList']},
                        {name: 'element', items: ['Link', 'Unlink', 'Table', 'UploadImage']},
                        {name: 'tools', items: ['Print', 'Maximize']}
                    ],
                    language: 'zh-cn',
                    format_tags: 'p;h1;h2;h3;pre',
                    extraPlugins: 'uimage',
                    removePlugins: 'easyimage,cloudservices,exportpdf',
                    removeButtons: 'Underline,Subscript,Superscript',
                    removeDialogTabs: 'image:advanced;link:advanced',
                    // 内容过滤
                    disallowedContent: 'script; *[on*]',
                    allowedContent: true,
                    font_names: '微软雅黑/Microsoft YaHei;宋体/SimSun;新宋体/NSimSun;仿宋/FangSong;楷体/KaiTi;黑体/SimHei;'
                });
            }
        });
    });
    
    // 表单提交监听
    form.on('submit(*)', function(data) {
        // 确保富文本编辑器内容同步到表单字段
        if (solutionEditor && typeof solutionEditor.getData === 'function') {
            var solutionContent = solutionEditor.getData();
            $('textarea[name="solution_description"]').val(solutionContent);
            
            // 验证富文本内容
            if (!solutionContent.trim()) {
                layer.msg('解决方案不能为空', {icon: 2});
                return false;
            }
        }
        
        console.log('Form data:', data.field);
        return true;
    });
});
</script>
