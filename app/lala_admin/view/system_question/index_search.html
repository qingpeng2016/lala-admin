<!-- 搜索表单 -->
<form class="layui-form" method="get" action="">
    <div class="layui-row layui-col-space15">
        <div class="layui-col-md2">
            <div class="layui-form-item">
                <label class="layui-form-label">问题类型</label>
                <div class="layui-input-block">
                    <select name="type" lay-filter="type">
                        <option value="">全部类型</option>
                        {foreach $type_list as $key => $val}
                        <option value="{$key}" {if isset($get.type) && $get.type eq $key}selected{/if}>{$val}</option>
                        {/foreach}
                    </select>
                </div>
            </div>
        </div>
        <div class="layui-col-md2">
            <div class="layui-form-item">
                <label class="layui-form-label">问题分类</label>
                <div class="layui-input-block">
                    <select name="category" lay-filter="category">
                        <option value="">全部分类</option>
                        {foreach $category_list as $key => $val}
                        <option value="{$key}" {if isset($get.category) && $get.category eq $key}selected{/if}>{$val}</option>
                        {/foreach}
                    </select>
                </div>
            </div>
        </div>
        <div class="layui-col-md3">
            <div class="layui-form-item">
                <label class="layui-form-label">关键词</label>
                <div class="layui-input-block">
                    <input type="text" name="keyword" value="{$get.keyword|default=''}" placeholder="搜索标题、问题描述、解决方案" class="layui-input">
                </div>
            </div>
        </div>
        <div class="layui-col-md2">
            <div class="layui-form-item">
                <div class="layui-input-block">
                    <button class="layui-btn" lay-submit lay-filter="search">
                        <i class="layui-icon layui-icon-search"></i> 搜索
                    </button>
                    <button type="reset" class="layui-btn layui-btn-primary">
                        <i class="layui-icon layui-icon-refresh"></i> 重置
                    </button>
                </div>
            </div>
        </div>
    </div>
</form>
