<form class="layui-form layui-form-pane form-search" action="{:request()->url()}" onsubmit="return false" method="get"
      autocomplete="off">
    <div class="layui-form-item layui-inline">
        <label class="layui-form-label">问题ID</label>
        <div class="layui-input-inline">
            <input name="id" value="{$get.id|default=''}" placeholder="请输入问题ID"
                   class="layui-input">
        </div>
    </div>
    <div class="layui-form-item layui-inline">
        <label class="layui-form-label">问题类型</label>
        <div class="layui-input-inline">
            <select name="type" class="layui-select">
                <option value="">所有类型</option>
                {foreach $type_list as $key=>$item}
                <option value="{$key}" {if isset($get.type) && $get.type==$key}selected{/if}>{$item}
                </option>
                {/foreach}
            </select>
        </div>
    </div>
    <div class="layui-form-item layui-inline">
        <label class="layui-form-label">问题分类</label>
        <div class="layui-input-inline">
            <select name="category" class="layui-select">
                <option value="">所有分类</option>
                {foreach $category_list as $key=>$item}
                <option value="{$key}" {if isset($get.category) && $get.category==$key}selected{/if}>{$item}
                </option>
                {/foreach}
            </select>
        </div>
    </div>
    <div class="layui-form-item layui-inline">
        <label class="layui-form-label">关键词</label>
        <div class="layui-input-inline">
            <input name="keyword" value="{$get.keyword|default=''}" placeholder="搜索标题、问题描述、解决方案"
                   class="layui-input">
        </div>
    </div>
    <div class="layui-form-item layui-inline">
        <label class="layui-form-label">创建时间</label>
        <div class="layui-input-inline">
            <input name="date_range" value="{$get.date_range|default=''}" placeholder="请选择日期范围"
                   class="layui-input" id="date_range">
        </div>
    </div>
    <div class="layui-form-item layui-inline">
        <button class="layui-btn layui-btn-primary"><i class="layui-icon">&#xe615;</i> 搜 索</button>
        <button class="layui-btn layui-btn-sm layui-btn-primary" data-modal='{:url("add")}'><i class="layui-icon">&#xe654;</i> 新增问答</button>
    </div>
</form>

<script>
    layui.use(['form', 'laydate'], function () {
        var form = layui.form;
        var laydate = layui.laydate;

        // 初始化日期范围选择器
        laydate.render({
            elem: '#date_range',
            type: 'date',
            range: ' - ',
            format: 'yyyy-MM-dd'
        });
    });
</script>
