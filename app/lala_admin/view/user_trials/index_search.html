<form class="layui-form layui-form-pane form-search" action="{:request()->url()}" onsubmit="return false" method="get"
      autocomplete="off">
    <div class="layui-form-item layui-inline">
        <label class="layui-form-label">用户ID</label>
        <div class="layui-input-inline">
            <input name="user_id" value="{$get.user_id|default=''}" placeholder="请输入用户ID"
                   class="layui-input" type="number">
        </div>
    </div>
    <div class="layui-form-item layui-inline">
        <label class="layui-form-label">服务器ID</label>
        <div class="layui-input-inline">
            <input name="server_id" value="{$get.server_id|default=''}" placeholder="请输入服务器ID"
                   class="layui-input" type="number">
        </div>
    </div>
    <div class="layui-form-item layui-inline">
        <label class="layui-form-label">产品名称</label>
        <div class="layui-input-inline">
            <input name="product_name" value="{$get.product_name|default=''}" placeholder="请输入产品名称"
                   class="layui-input">
        </div>
    </div>
    <div class="layui-form-item layui-inline">
        <label class="layui-form-label">状态</label>
        <div class="layui-input-inline">
            <select name="status" class="layui-select">
                <option value="">所有状态</option>
                {foreach $status_list as $key=>$item}
                <option value="{$key}" {if isset($get.status) && $get.status==$key}selected{/if}>{$item}
                </option>
                {/foreach}
            </select>
        </div>
    </div>
    <div class="layui-form-item layui-inline">
        <label class="layui-form-label">开始时间</label>
        <div class="layui-input-inline">
            <input name="trial_start" value="{$get.trial_start|default=''}" placeholder="试用开始时间"
                   class="layui-input" type="date">
        </div>
    </div>
    <div class="layui-form-item layui-inline">
        <label class="layui-form-label">结束时间</label>
        <div class="layui-input-inline">
            <input name="trial_end" value="{$get.trial_end|default=''}" placeholder="试用结束时间"
                   class="layui-input" type="date">
        </div>
    </div>
    <div class="layui-form-item layui-inline">
        <button class="layui-btn layui-btn-primary"><i class="layui-icon">&#xe615;</i> 搜 索</button>
        <button class="layui-btn layui-btn-sm layui-btn-primary" data-modal='{:url("add")}'><i class="layui-icon">&#xe654;</i> 新增试用</button>
    </div>
</form>

<script>
    layui.use(['form'], function () {
        var form = layui.form;
    });
</script>
