<form class="layui-form layui-card" action="{:request()->url()}" data-auto="true" method="post" autocomplete="off">
    <div class="layui-card-body">

        <div class="layui-form-item">
            <label class="layui-form-label">上游名称 <span style="color: red;">*</span></label>
            <div class="layui-input-block">
                <input name="provider_name" value='{$vo.provider_name|default=""}' required placeholder="请输入上游名称，如：牛总、学长云等" class="layui-input" maxlength="128">
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">地区</label>
            <div class="layui-input-block">
                <select name="region" class="layui-select">
                    <option value="">请选择地区</option>
                    {foreach $region_list as $key=>$item}
                    <option value="{$key}" {if isset($vo.region) && $vo.region eq $key}selected{/if}>{$item}</option>
                    {/foreach}
                </select>
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">产品名称</label>
            <div class="layui-input-block">
                <input name="product_name" value='{$vo.product_name|default=""}' placeholder="请输入产品名称" class="layui-input" maxlength="128">
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">硬件信息</label>
            <div class="layui-input-block">
                <textarea name="hardware_info" placeholder="请输入硬件信息，例如：CPU:4C, MEM:8GB, DISK:64GB, BW:500Mbps" class="layui-textarea" rows="3">{$vo.hardware_info|default=""}</textarea>
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">操作系统</label>
            <div class="layui-input-block">
                <select name="os_type" class="layui-select">
                    <option value="">请选择操作系统</option>
                    {foreach $os_type_list as $key=>$item}
                    <option value="{$key}" {if isset($vo.os_type) && $vo.os_type eq $key}selected{/if}>{$item}</option>
                    {/foreach}
                </select>
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">开机方式</label>
            <div class="layui-input-block">
                <select name="startup_mode" class="layui-select">
                    <option value="">请选择开机方式</option>
                    {foreach $startup_mode_list as $key=>$item}
                    <option value="{$key}" {if isset($vo.startup_mode) && $vo.startup_mode eq $key}selected{/if}>{$item}</option>
                    {/foreach}
                </select>
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">网络信息</label>
            <div class="layui-input-block">
                <textarea name="network_info" placeholder="请输入网络信息，例如：38.150.11.192/26, GW:38.150.11.193, Netmask:255.255.255.192" class="layui-textarea" rows="3">{$vo.network_info|default=""}</textarea>
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">母鸡登录信息</label>
            <div class="layui-input-block">
                <textarea name="host_login_info" placeholder="请输入母鸡登录信息，例如：IP:103.180.28.233, User:root, Password:xxxx" class="layui-textarea" rows="3">{$vo.host_login_info|default=""}</textarea>
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">价格（RMB）</label>
            <div class="layui-input-block">
                <input name="price" value='{$vo.price|default="0"}' placeholder="请输入成本价格" class="layui-input" type="number" step="0.01" min="0">
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">计费模式</label>
            <div class="layui-input-block">
                <select name="billing_model" class="layui-select">
                    <option value="">请选择计费模式</option>
                    {foreach $billing_model_list as $key=>$item}
                    <option value="{$key}" {if isset($vo.billing_model) && $vo.billing_model eq $key}selected{/if}>{$item}</option>
                    {/foreach}
                </select>
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">付费周期</label>
            <div class="layui-input-block">
                <select name="billing_period" class="layui-select">
                    <option value="">请选择付费周期</option>
                    {foreach $billing_period_list as $key=>$item}
                    <option value="{$key}" {if isset($vo.billing_period) && $vo.billing_period eq $key}selected{/if}>{$item}</option>
                    {/foreach}
                </select>
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">备注信息</label>
            <div class="layui-input-block">
                <textarea name="remarks" placeholder="请输入其他备注信息" class="layui-textarea" rows="3">{$vo.remarks|default=""}</textarea>
            </div>
        </div>

        <div class="hr-line-dashed"></div>
        <div class="layui-form-item text-center">
            <button class="layui-btn" type='submit'>保存</button>
            <button class="layui-btn layui-btn-danger" type='button' data-confirm="确定要取消吗？" data-close>取消</button>
        </div>
    </div>
</form>

<script>
layui.use(['form'], function(){
    var form = layui.form;
});
</script>
