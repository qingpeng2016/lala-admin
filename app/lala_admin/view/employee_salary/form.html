{extend name="../../admin/view/main"}

{block name="content"}
<form class="layui-form layui-card" action="{:request()->url()}" data-auto="true" method="post" autocomplete="off">
    <div class="layui-card-body">
        
        <!-- 基本信息 -->
        <fieldset class="layui-elem-field layui-field-title">
            <legend>基本信息</legend>
        </fieldset>
        
        <div class="layui-form-item">
            <label class="layui-form-label">选择员工</label>
            <div class="layui-input-block">
                <select name="employee_select" lay-filter="employee_select" lay-search>
                    <option value="">请选择员工</option>
                    {foreach $employees as $employee}
                    <option value="{$employee.id}" 
                        data-nickname="{$employee.nickname}" 
                        data-usertype="{$employee.usertype}" 
                        data-base-salary="{$employee.base_salary|default='0.00'}"
                        data-employee-type="{$employee.employee_type|default=''}"
                        {if isset($vo.employee_id) and $vo.employee_id eq $employee.id}selected{/if}>
                        {$employee.nickname} (ID: {$employee.id})
                    </option>
                    {/foreach}
                </select>
                <div class="layui-form-mid layui-word-aux">选择员工后自动填充基本信息</div>
            </div>
        </div>
        
        <div class="layui-form-item">
            <label class="layui-form-label">员工ID</label>
            <div class="layui-input-block">
                <input name="employee_id" value='{$vo.employee_id|default=""}' required placeholder="请输入员工ID" class="layui-input" lay-verify="required" readonly>
            </div>
        </div>
        
        <div class="layui-form-item">
            <label class="layui-form-label">员工姓名</label>
            <div class="layui-input-block">
                <input name="employee_name" value='{$vo.employee_name|default=""}' required placeholder="请输入员工姓名" class="layui-input" lay-verify="required" readonly>
            </div>
        </div>
        
        <div class="layui-form-item">
            <label class="layui-form-label">员工类型</label>
            <div class="layui-input-block">
                <select name="employee_type" required lay-verify="required" lay-filter="employee_type">
                    <option value="">请选择员工类型</option>
                    {foreach $employee_type_list as $key => $value}
                    <option value="{$key}" {if isset($vo.employee_type) and $vo.employee_type eq $key}selected{/if}>{$value}</option>
                    {/foreach}
                </select>
            </div>
        </div>
        
        <div class="layui-form-item">
            <label class="layui-form-label">工资月份</label>
            <div class="layui-input-block">
                <select name="salary_month" required lay-verify="required">
                    {foreach $month_options as $option}
                    <option value="{$option.value}" 
                        {if isset($vo.salary_month) and $vo.salary_month eq $option.value}selected{elseif !isset($vo.salary_month) and $option.is_current}selected{/if}>
                        {$option.text}
                    </option>
                    {/foreach}
                </select>
                <div class="layui-form-mid layui-word-aux">默认选择本月，可选择上个月或下个月</div>
            </div>
        </div>
        
        <!-- 基础工资 -->
        <fieldset class="layui-elem-field layui-field-title">
            <legend>基础工资</legend>
        </fieldset>
        
        <div class="layui-form-item">
            <label class="layui-form-label">底薪</label>
            <div class="layui-input-block">
                <input name="base_salary" value='{$vo.base_salary|default="0.00"}' placeholder="请输入底薪" class="layui-input" lay-verify="number" readonly>
            </div>
        </div>
        
        <!-- 基础福利（仅全职员工） -->
        <fieldset class="layui-elem-field layui-field-title" id="welfare_section">
            <legend>基础福利（仅全职员工）</legend>
        </fieldset>
        
        <div class="layui-form-item" id="welfare_fields">
            <div class="layui-row layui-col-space10">
                <div class="layui-col-md6">
                    <label class="layui-form-label">全勤奖</label>
                    <div class="layui-input-block">
                        <input name="attendance_bonus" value='{$vo.attendance_bonus|default="0.00"}' placeholder="全勤奖" class="layui-input" lay-verify="number" readonly>
                    </div>
                </div>
                <div class="layui-col-md6">
                    <label class="layui-form-label">餐补</label>
                    <div class="layui-input-block">
                        <input name="meal_allowance" value='{$vo.meal_allowance|default="0.00"}' placeholder="餐补" class="layui-input" lay-verify="number" readonly>
                    </div>
                </div>
            </div>
            <div class="layui-row layui-col-space10" style="margin-top: 15px;">
                <div class="layui-col-md6">
                    <label class="layui-form-label">晚班交通补助</label>
                    <div class="layui-input-block">
                        <input name="night_transport" value='{$vo.night_transport|default="0.00"}' placeholder="晚班交通补助" class="layui-input" lay-verify="number" readonly>
                    </div>
                </div>
                <div class="layui-col-md6">
                    <label class="layui-form-label">迟到/早退扣款</label>
                    <div class="layui-input-block">
                        <input name="late_penalty" value='{$vo.late_penalty|default="0.00"}' placeholder="迟到/早退扣款" class="layui-input" lay-verify="number" readonly>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- 提成明细 -->
        <fieldset class="layui-elem-field layui-field-title">
            <legend>提成明细</legend>
        </fieldset>
        
        <div class="layui-form-item">
            <div class="layui-row layui-col-space10">
                <div class="layui-col-md6">
                    <label class="layui-form-label">新增客户提成</label>
                    <div class="layui-input-block">
                        <input name="new_customer_commission" value='{$vo.new_customer_commission|default="0.00"}' placeholder="新增客户提成" class="layui-input" lay-verify="number">
                    </div>
                </div>
                <div class="layui-col-md6">
                    <label class="layui-form-label">历史客户提成</label>
                    <div class="layui-input-block">
                        <input name="old_customer_commission" value='{$vo.old_customer_commission|default="0.00"}' placeholder="历史客户提成" class="layui-input" lay-verify="number">
                    </div>
                </div>
            </div>
            <div class="layui-row layui-col-space10" style="margin-top: 15px;">
                <div class="layui-col-md6">
                    <label class="layui-form-label">月度奖金</label>
                    <div class="layui-input-block">
                        <input name="monthly_bonus" value='{$vo.monthly_bonus|default="0.00"}' placeholder="月度奖金" class="layui-input" lay-verify="number">
                    </div>
                </div>
                <div class="layui-col-md6">
                    <label class="layui-form-label">单价奖金</label>
                    <div class="layui-input-block">
                        <input name="price_bonus" value='{$vo.price_bonus|default="0.00"}' placeholder="单价奖金" class="layui-input" lay-verify="number">
                    </div>
                </div>
            </div>
        </div>
        
        <!-- 最终工资 -->
        <fieldset class="layui-elem-field layui-field-title">
            <legend>最终工资</legend>
        </fieldset>
        
        <div class="layui-form-item">
            <div class="layui-row layui-col-space10">
                <div class="layui-col-md6">
                    <label class="layui-form-label">其他扣款</label>
                    <div class="layui-input-block">
                        <input name="deductions" value='{$vo.deductions|default="0.00"}' placeholder="其他扣款" class="layui-input" lay-verify="number">
                    </div>
                </div>
                <div class="layui-col-md6">
                    <label class="layui-form-label">状态</label>
                    <div class="layui-input-block">
                        {foreach $status_list as $key => $value}
                        <input type="radio" name="status" value="{$key}" title="{$value}" {if isset($vo.status) and $vo.status eq $key}checked{elseif !isset($vo.status) and $key eq '0'}checked{/if}>
                        {/foreach}
                    </div>
                </div>
            </div>
        </div>
        
        <div class="layui-form-item">
            <label class="layui-form-label">备注</label>
            <div class="layui-input-block">
                <textarea name="remark" placeholder="请输入备注" class="layui-textarea" rows="3">{$vo.remark|default=""}</textarea>
            </div>
        </div>
        
        <div class="hr-line-dashed"></div>
        {notempty name='vo.id'}<input type='hidden' value='{$vo.id}' name='id'>{/notempty}
        <div class="layui-form-item text-center">
            <button class="layui-btn" type='submit' lay-submit lay-filter="formSubmit">保存数据</button>
            <button class="layui-btn layui-btn-danger" type='button' data-close>取消编辑</button>
        </div>
    </div>
</form>
{/block}

{block name="script"}
<script>
layui.use(['form'], function(){
    var form = layui.form;
    
    // 监听员工选择变化
    form.on('select(employee_select)', function(data){
        var employeeId = data.value;
        if (employeeId) {
            // 获取选中的option元素
            var selectedOption = $(data.elem).find('option:selected');
            var nickname = selectedOption.data('nickname');
            var usertype = selectedOption.data('usertype');
            var baseSalary = selectedOption.data('base-salary') || '0.00';
            var employeeType = selectedOption.data('employee-type') || '';
            
            // 如果employee_type为空，使用usertype映射
            if (!employeeType) {
                var employeeTypeMap = {
                    'admin': 'full_time',     // 管理员 -> 全职员工
                    'user': 'part_time',      // 普通用户 -> 普通兼职
                    'vip': 'part_time_base'   // VIP用户 -> 底薪兼职
                };
                employeeType = employeeTypeMap[usertype] || 'full_time';
            }
            
            // 填充基本信息
            $('input[name="employee_id"]').val(employeeId);
            $('input[name="employee_name"]').val(nickname);
            $('input[name="base_salary"]').val(baseSalary);
            
            // 设置员工类型
            $('select[name="employee_type"]').val(employeeType);
            form.render('select'); // 重新渲染select
            
            // 根据员工ID获取基础福利规则
            fillWelfareData(employeeId);
            
            // 触发员工类型变化事件
            toggleWelfareFields(employeeType);
        } else {
            // 清空所有字段
            clearAllFields();
        }
    });
    
    // 根据员工ID获取完整员工信息包括基础福利
    function fillWelfareData(employeeId) {
        if (!employeeId) return;
        
        // 调用后端API获取员工信息和基础福利规则
        $.ajax({
            url: '{:url("getEmployeeInfo")}',
            type: 'GET',
            data: { employee_id: employeeId },
            dataType: 'json',
            success: function(res) {
                if (res.code === 1 && res.data) {
                    var data = res.data;
                    
                    // 填充基础福利数据
                    $('input[name="attendance_bonus"]').val(data.attendance_bonus || '0.00');
                    $('input[name="meal_allowance"]').val(data.meal_allowance || '0.00');
                    $('input[name="night_transport"]').val(data.night_transport || '0.00');
                    $('input[name="late_penalty"]').val(data.late_penalty || '0.00');
                } else {
                    layer.msg(res.info || '获取员工信息失败', {icon: 2});
                    // 失败时设为0
                    $('input[name="attendance_bonus"]').val('0.00');
                    $('input[name="meal_allowance"]').val('0.00');
                    $('input[name="night_transport"]').val('0.00');
                    $('input[name="late_penalty"]').val('0.00');
                }
            },
            error: function() {
                layer.msg('网络错误，请重试', {icon: 2});
                // 错误时设为0
                $('input[name="attendance_bonus"]').val('0.00');
                $('input[name="meal_allowance"]').val('0.00');
                $('input[name="night_transport"]').val('0.00');
                $('input[name="late_penalty"]').val('0.00');
            }
        });
    }
    
    // 清空所有字段
    function clearAllFields() {
        $('input[name="employee_id"]').val('');
        $('input[name="employee_name"]').val('');
        $('input[name="base_salary"]').val('0.00');
        $('select[name="employee_type"]').val('');
        form.render('select');
        
        // 清空福利字段
        $('input[name="attendance_bonus"]').val('0.00');
        $('input[name="meal_allowance"]').val('0.00');
        $('input[name="night_transport"]').val('0.00');
        $('input[name="late_penalty"]').val('0.00');
        
        toggleWelfareFields('');
    }

    // 员工类型变化处理函数
    function toggleWelfareFields(employeeType) {
        var welfareSection = document.getElementById('welfare_section');
        var welfareFields = document.getElementById('welfare_fields');
        
        if (employeeType === 'full_time') {
            welfareSection.style.display = 'block';
            welfareFields.style.display = 'block';
        } else {
            welfareSection.style.display = 'none';
            welfareFields.style.display = 'none';
        }
    }

    // 监听员工类型变化
    form.on('select(employee_type)', function(data){
        toggleWelfareFields(data.value);
    });
    
    // 页面加载时检查员工类型
    var currentEmployeeType = $('select[name="employee_type"]').val();
    toggleWelfareFields(currentEmployeeType);
    
    // 如果是编辑模式，根据已有的员工ID设置员工选择框
    var currentEmployeeId = $('input[name="employee_id"]').val();
    if (currentEmployeeId) {
        $('select[name="employee_select"]').val(currentEmployeeId);
        form.render('select');
    }
    
    // 自定义验证规则
    form.verify({
        number: function(value) {
            if (value && !/^\d+(\.\d{1,2})?$/.test(value)) {
                return '请输入有效的数字格式（最多2位小数）';
            }
        }
    });
    
    // 监听表单提交
    form.on('submit(formSubmit)', function(data){
        // 工资月份现在是下拉选择，无需验证格式
        return true;
    });
});
</script>

<style>
.layui-elem-field {
    margin-top: 20px;
}

.layui-field-title legend {
    color: #009688;
    font-weight: bold;
}

/* 只读字段样式 */
.layui-input[readonly] {
    background-color: #f8f8f8;
    color: #666;
    cursor: not-allowed;
}

/* 员工选择提示样式 */
.layui-word-aux {
    color: #999;
    font-size: 12px;
}
</style>
{/block}
