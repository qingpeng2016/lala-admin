<form class="layui-form layui-form-pane form-search" action="{:request()->url()}" onsubmit="return false" method="get" autocomplete="off">
    <div class="layui-form-item layui-inline">
        <label class="layui-form-label">ID</label>
        <div class="layui-input-inline">
            <input type="text" name="id" placeholder="请输入ID" value="{$get.id|default=''}" class="layui-input">
        </div>
    </div>
    <div class="layui-form-item layui-inline">
        <label class="layui-form-label">用户ID</label>
        <div class="layui-input-inline">
            <input type="text" name="userid" placeholder="请输入用户ID" value="{$get.userid|default=''}" class="layui-input">
        </div>
    </div>
    <div class="layui-form-item layui-inline">
        <label class="layui-form-label">邮箱</label>
        <div class="layui-input-inline" style="width: 250px;">
            <input type="text" name="email" placeholder="请输入邮箱" value="{$get.email|default=''}" class="layui-input">
        </div>
    </div>
    <div class="layui-form-item layui-inline">
        <label class="layui-form-label">状态</label>
        <div class="layui-input-inline">
            <select name="domainstatus" class="layui-select">
                <option value="">-- 全部状态 --</option>
                {foreach $domainstatus_list as $key=>$value}
                <option value="{$key}" {if input('get.domainstatus') eq $key}selected{/if}>{$value}</option>
                {/foreach}
            </select>
        </div>
    </div>
    <div class="layui-form-item layui-inline">
        <button class="layui-btn layui-btn-primary"><i class="layui-icon">&#xe615;</i> 搜 索</button>
    </div>
    <div class="layui-form-item layui-inline">
        <button type="button" class="layui-btn layui-btn-normal" onclick="createPaymentLink()"><i class="layui-icon">&#xe654;</i> 创建付款链接</button>
    </div>
</form>

<!-- 官方充值地址 -->
<div class="layui-card" style="margin-top: 15px;">
    <div class="layui-card-header" style="display: flex; align-items: center; gap: 10px;">
        <h3>官方充值地址</h3>
        <button type="button" class="layui-btn layui-btn-warm layui-btn-xs" onclick="copyOfficialAddress()">
            <i class="layui-icon">&#xe62f;</i> 复制地址
        </button>
    </div>
    <div class="layui-card-body">
        <div class="address-container">
            <div class="address-item">
                <label>Trc20-USDT:</label>
                <span class="address-text">TLteWz6XU89cAy4nfc3EPhZAX63rh8eTWb</span>
            </div>
            <div class="address-item">
                <label>Ploygon-USDT:</label>
                <span class="address-text">0xd43174aC01d55793c2feE0516E03C7A905D51d8B</span>
            </div>
        </div>
    </div>
</div>

<script>
// 复制官方充值地址
function copyOfficialAddress() {
    var addressText = "Trc20-USDT: TLteWz6XU89cAy4nfc3EPhZAX63rh8eTWb\n\nPloygon-USDT: 0xd43174aC01d55793c2feE0516E03C7A905D51d8B";
    
    // 创建临时文本区域
    var textArea = document.createElement("textarea");
    textArea.value = addressText;
    textArea.style.position = "fixed";
    textArea.style.left = "-999999px";
    textArea.style.top = "-999999px";
    document.body.appendChild(textArea);
    
    // 选择并复制
    textArea.focus();
    textArea.select();
    
    try {
        document.execCommand('copy');
        if (typeof layer !== 'undefined') {
            layer.msg('官方充值地址已复制到剪贴板', {icon: 1, time: 2000});
        } else {
            alert('官方充值地址已复制到剪贴板');
        }
    } catch (err) {
        if (typeof layer !== 'undefined') {
            layer.msg('复制失败，请手动复制', {icon: 2, time: 3000});
        } else {
            alert('复制失败，请手动复制');
        }
    }
    
    // 清理临时元素
    document.body.removeChild(textArea);
}
</script>

<style>
.address-container {
    background: #f8f8f8;
    padding: 15px;
    border-radius: 6px;
    border: 1px solid #e6e6e6;
}

.address-item {
    margin-bottom: 12px;
    padding: 8px 0;
    border-bottom: 1px dashed #ddd;
}

.address-item:last-child {
    margin-bottom: 0;
    border-bottom: none;
}

.address-item label {
    display: inline-block;
    width: 120px;
    font-weight: bold;
    color: #333;
}

.address-text {
    font-family: 'Courier New', monospace;
    background: #fff;
    padding: 4px 8px;
    border: 1px solid #ddd;
    border-radius: 3px;
    color: #666;
    user-select: all;
    cursor: text;
}

.address-text:hover {
    background: #f0f0f0;
    border-color: #1E9FFF;
}

.layui-btn-warm {
    background-color: #FFB800;
    border-color: #FFB800;
}

.layui-btn-warm:hover {
    background-color: #FF9500;
    border-color: #FF9500;
}
</style>
