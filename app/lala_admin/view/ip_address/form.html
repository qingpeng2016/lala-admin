<form class="layui-form layui-card" action="{:request()->url()}" data-auto="true" method="post" autocomplete="off">
    <div class="layui-card-body">

        <div class="layui-form-item">
            <label class="layui-form-label">起始IP <span style="color: red;">*</span></label>
            <div class="layui-input-block">
                <input name="ip_address_start" value='{$vo.ip_address|default=""}' required placeholder="请输入起始IP地址，如：120.233.42.214" class="layui-input" maxlength="50">
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">结束IP</label>
            <div class="layui-input-block">
                <input name="ip_address_end" placeholder="请输入结束IP地址（可选），如：120.233.42.216" class="layui-input" maxlength="50">
                <div class="layui-form-mid layui-word-aux">
                    留空则只添加起始IP，填写则批量添加起始到结束之间的所有IP（最多1000个）
                </div>
            </div>
        </div>
        <div class="layui-form-item">
            <div class="layui-input-block">
                <blockquote class="layui-elem-quote" style="border-left-color: #009688;">
                    <i class="layui-icon" style="color: #009688;">&#xe702;</i> 
                    <strong>批量添加示例：</strong><br>
                    起始IP：120.233.42.214<br>
                    结束IP：120.233.42.216<br>
                    将会添加：120.233.42.214、120.233.42.215、120.233.42.216（共3个IP）
                </blockquote>
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">所属上游 <span style="color: red;">*</span></label>
            <div class="layui-input-block">
                <select name="upstream_provider" class="layui-select" required>
                    <option value="">请选择所属上游</option>
                    {foreach $upstream_provider_list as $key=>$item}
                    <option value="{$key}" {if isset($vo.upstream_provider) && $vo.upstream_provider eq $key}selected{/if}>{$item}</option>
                    {/foreach}
                </select>
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">所属母机</label>
            <div class="layui-input-block">
                <select name="parent_machine" class="layui-select">
                    <option value="">请选择所属母机</option>
                    <option value="Node11" {if isset($vo.parent_machine) && $vo.parent_machine eq 'Node11'}selected{/if}>Node11</option>
                    <option value="Node24" {if isset($vo.parent_machine) && $vo.parent_machine eq 'Node24'}selected{/if}>Node24</option>
                </select>
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">所属地区 <span style="color: red;">*</span></label>
            <div class="layui-input-block">
                <select name="region" class="layui-select" required>
                    <option value="">请选择所属地区</option>
                    {foreach $region_list as $key=>$item}
                    <option value="{$key}" {if isset($vo.region) && $vo.region eq $key}selected{/if}>{$item}</option>
                    {/foreach}
                </select>
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">网络类型 <span style="color: red;">*</span></label>
            <div class="layui-input-block">
                <select name="network_type" class="layui-select" required>
                    <option value="">请选择网络类型</option>
                    {foreach $network_type_list as $key=>$item}
                    <option value="{$key}" {if isset($vo.network_type) && $vo.network_type eq $key}selected{/if}>{$item}</option>
                    {/foreach}
                </select>
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">虚拟化系统</label>
            <div class="layui-input-block">
                <select name="virtualization_system" class="layui-select">
                    <option value="">请选择虚拟化系统</option>
                    {foreach $virtualization_system_list as $key=>$item}
                    <option value="{$key}" {if isset($vo.virtualization_system) && $vo.virtualization_system eq $key}selected{/if}>{$item}</option>
                    {/foreach}
                </select>
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">虚拟化系统机器ID</label>
            <div class="layui-input-block">
                <input name="virt_system_machine_id" value='{$vo.virt_system_machine_id|default="0"}' placeholder="请输入虚拟化系统机器ID" class="layui-input" type="number" min="0">
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">状态 <span style="color: red;">*</span></label>
            <div class="layui-input-block">
                <select name="status" class="layui-select" required>
                    {foreach $status_list as $key=>$item}
                    <option value="{$key}" {if !isset($vo.status) && $key eq 'unused'}selected{elseif isset($vo.status) && $vo.status eq $key}selected{/if}>{$item}</option>
                    {/foreach}
                </select>
            </div>
        </div>
        <div class="hr-line-dashed"></div>
        {notempty name='vo.id'}<input type='hidden' value='{$vo.id}' name='id'>{/notempty}
        <div class="layui-form-item text-center">
            <button class="layui-btn" type='submit'>保存数据</button>
            <button class="layui-btn layui-btn-danger" type='button' data-confirm="确定要取消编辑吗？" data-close>取消编辑</button>
        </div>
    </div>
</form>

<script>
layui.use(['form'], function(){
    var form = layui.form;
    
    // 表单提交监听
    form.on('submit(*)', function(data) {
        console.log('Form data:', data.field);
        return true;
    });
});
</script>
