<form class="layui-form layui-form-pane form-search" action="{:request()->url()}" onsubmit="return false" method="get" autocomplete="off">
    <div class="layui-form-item layui-inline">
        <label class="layui-form-label">ID</label>
        <div class="layui-input-inline">
            <input type="text" name="id" placeholder="请输入ID" value="{$get.id|default=''}" class="layui-input">
        </div>
    </div>
    <div class="layui-form-item layui-inline">
        <label class="layui-form-label">用户ID</label>
        <div class="layui-input-inline">
            <input type="text" name="userid" placeholder="请输入用户ID" value="{$get.userid|default=''}" class="layui-input">
        </div>
    </div>
    <div class="layui-form-item layui-inline">
        <label class="layui-form-label">邮箱</label>
        <div class="layui-input-inline" style="width: 250px;">
            <input type="text" name="email" placeholder="请输入邮箱" value="{$get.email|default=''}" class="layui-input">
        </div>
    </div>
    <div class="layui-form-item layui-inline">
        <label class="layui-form-label">状态</label>
        <div class="layui-input-inline">
            <select name="domainstatus" class="layui-select">
                <option value="">-- 全部状态 --</option>
                {foreach $domainstatus_list as $key=>$value}
                <option value="{$key}" {if input('get.domainstatus') eq $key}selected{/if}>{$value}</option>
                {/foreach}
            </select>
        </div>
    </div>
    <div class="layui-form-item layui-inline">
        <button class="layui-btn layui-btn-primary"><i class="layui-icon">&#xe615;</i> 搜 索</button>
    </div>
</form>

<style>
.address-container {
    background: #f8f8f8;
    padding: 15px;
    border-radius: 6px;
    border: 1px solid #e6e6e6;
}

.address-item {
    margin-bottom: 12px;
    padding: 8px 0;
    border-bottom: 1px dashed #ddd;
}

.address-item:last-child {
    margin-bottom: 0;
    border-bottom: none;
}

.address-item label {
    display: inline-block;
    width: 120px;
    font-weight: bold;
    color: #333;
}

.address-text {
    font-family: 'Courier New', monospace;
    background: #fff;
    padding: 4px 8px;
    border: 1px solid #ddd;
    border-radius: 3px;
    color: #666;
    user-select: all;
    cursor: text;
}

.address-text:hover {
    background: #f0f0f0;
    border-color: #1E9FFF;
}

.layui-btn-warm {
    background-color: #FFB800;
    border-color: #FFB800;
}

.layui-btn-warm:hover {
    background-color: #FF9500;
    border-color: #FF9500;
}
</style>
